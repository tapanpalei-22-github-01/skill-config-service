# Production overrides for auth-service.
# Active only when the service runs with SPRING_PROFILES_ACTIVE=prod.
# These values are layered ON TOP of application.yml (prod wins).
auth:
  dev-endpoints-enabled: false
  cookie-secure: true
  email-enabled: true

# Do not expose the refresh endpoint in production.
management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.skillengine: INFO