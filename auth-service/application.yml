spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/authdb
    username: postgres
    password: postgres

server:
  ssl:
    enabled: true
    key-store: file:/certs/auth-service.p12
    key-store-password: changeit
    key-store-type: PKCS12
    key-alias: auth-service

auth:
  issuer: https://localhost:8443
  audience: skill-engine-platform
  access-token-ttl: PT15M
  refresh-token-ttl: P30D
  frontend-base-url: https://localhost:3000
  cors-allowed-origins: https://localhost:3000
  cookie-secure: true
  dev-endpoints-enabled: true
  email-enabled: true
  sms:
    provider: fake
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}